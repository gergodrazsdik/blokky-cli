# Verification of council/minimalism.yaml against the review-draft3 snapshot.
- id: MIN-1
  verdict: partly
  severity: major
  notes: |
    Quotes hold: CP-22 says "Such an opt-in is accident prevention, not a control: `sudo -n` in a leaf is equally available."; CP-28 and CP-30 are marked provisional; ADR 0005 Bad says "supporting `doas` from the start doubles the elevation paths the spike must verify"; ADR 0005 Good says "one plan file works with and without sudo (`defaults.become: invoker`)". No file in examples/ uses `defaults.become`, `invoker`, `become` on a script or probe (the only `defaults.become: invoker` is the illustrative shape in containers-and-privilege.md §3.1).
    Wrong or incomplete:
    - Count: "CP-21..CP-35 (15 rules)" is 13 rules; CP-31 and CP-33 don't exist.
    - "deploy-health-check uses it on three exec leaves": it has two `become: root` nodes (lines 60, 83) covering five leaves (podman pull, tee, systemctl restart; then tee, systemctl restart).
    - The finding doesn't answer ADR 0005's other Good, the one CP-28 normalizes: a `become` leaf gets "exactly the argv, environment and script text it would get without `become`, whatever environment policy sudoers or doas.conf set, and none of it appears on a command line". A plain `exec: [sudo, -n, ...]` leaf loses this: sudo's default env_reset strips the node's `env`/`export` values, and script text or secrets would have to go through argv or files. The proposed `sudo -n bash -- FILE` workaround also needs the file readable by the target user, which CP-29 forbids for run-owned files. That cost holds only for leaves that need env; the two examples' leaves (pull, tee with stdin, restart) don't, so the rewrite is valid for them.
    - CP-34 (effective user determined statically and in the run result) is a reviewability gain the finding doesn't weigh; with `sudo -n` as argv[0] a reviewer still sees it, so this is arguable rather than wrong.
    Core (large surface duplicating a leaf the spec calls equally available; root-run mode unused by examples) holds.
  proposal_impact: |
    Full cut: containers-and-privilege.md §3 (CP-21..CP-35) and CP-20; reference.md §4.9, §7 validity matrix (Scope column), RF-6 list, §9 `become` bullet; syntax.md defaults table (line 150), user-name grammar (213), field tables (291, 363); schema user definition ("for become also the special value invoker"); errors.md BK_BECOME_DISABLED/BK_BECOME_FAILED; results.md `user` field (CP-34); glossary `invoker`; ADR 0005 Q17 and ADR 0014 consent paragraph need a superseding ADR; examples basics/become-root and scenarios/deploy-health-check (two nodes, five leaves) rewritten; README feature tables. Fallback (drop invoker/defaults.become/root-drop) touches CP-21, CP-23, CP-24, CP-26, CP-32, syntax defaults row, glossary, schema description; no example changes.
- id: MIN-2
  verdict: partly
  severity: major
  notes: |
    Surface claims check out: CP-1..CP-20, CP-7 "a later question (Q16b)", CP-8 provisional, §2.6 "Containers are not a sandbox by default ... Blokky never uses a container to decide what is allowed." No example uses `container.user` or `env_pass`. Uses: basics/container-build and the "tests in the .NET SDK container" node of integration-tests.
    Wrong or incomplete:
    - "finally-cleanup, services-depends-on ... run docker run/docker exec as leaves" are basics, not scenarios (only integration-tests is a scenario). Minor.
    - "three spike dependencies": the container part has two open items (CP-7 engine choice, CP-8 in-container kill); CP-28/CP-30 belong to `become`.
    - Option (b) "drop env_pass (use env: { X: { from_env: X } })" is not equivalent: CP-16 says an unset `env_pass` name "is not passed, without an error", while VA-40 makes an unset `from_env` a node error (BK_FROM_ENV_UNSET).
    - The `docker run` rewrite loses two specified behaviours the finding doesn't mention: CP-8 (stopping the process inside the container; killing the `docker` client after the grace period can leave the container running) and CP-7 (engine CLI started with Blokky's environment, so a node `env` such as DOCKER_HOST can't redirect it). With `-v .:/src` the host path is relative; older Docker versions reject relative bind sources (Podman accepts them). These are costs of option (a), not refutations: the plain form is the same as plain bash, which the posture accepts.
    Core (largest modifier, ergonomics only, both uses expressible as engine leaves) holds; kind `question` fits.
  proposal_impact: |
    (a) Cut: containers-and-privilege.md §1-§2 (CP-1..CP-20; CP-1/CP-2 path model and CO-46's container note), reference.md §4.8, §7 Scope column, RF-6 list, RF-21 (`mounts` is the only field allowing empty lists), §9 container bullet; syntax.md field rows (`mounts`, `container.user`, user grammar); schema; conditions.md CO-46 "also under `container`"; CP-11 runtime mounts; results.md engine/digest/container id; ADR 0005 Q16 and ADR 0012 superseded; examples basics/container-build and integration-tests (the test node also sets `cwd: /src` and `env: API_URL`, which must become `-w /src -e API_URL` with the env still set on the leaf); conformance feature ids. (b) env_pass semantics change (unset name becomes an error) unless kept as a silent pass.
- id: MIN-3
  verdict: partly
  severity: major
  notes: |
    ADR 0014 quote is exact ("Bad: `services` gain two fields ... the review should look at whether services earn their size."). ADR 0014 records list order ("in list order, each ready first") as an option and says the maintainer departed from the recommendation for start order, so the finding's reading is right. Both examples are a linear db -> api chain; mail in integration-tests is independent. `on_exit: ignore` appears once (integration-tests mail). `output:` readiness is used for the api in both examples; CO-43 does define decoding, trimming and a size window; CO-44 limits port/output to `ready:`.
    Wrong: "`{ port: 5080, open: true }` (CO-42) is the same check". It isn't quite: a port check passes for any listener on 5080 (a stale api from a crashed run, another process), while the output check ties readiness to this service's own process. In integration-tests the api binds `0.0.0.0:5080`, and CO-42 checks 127.0.0.1/::1, which still works. The difference is real but small; it weakens the "drop `output:`" sub-proposal, not the depends_on/on_exit core.
  proposal_impact: |
    execution-model.md EM-61..EM-65 (start and reverse-dependency stop order become list order/reverse list order); RF-24 (drop the depends_on half); reference.md §4.10; conditions.md CO-43/CO-44 if `output:` goes; errors.md BK_SERVICE_EXITED text for on_exit; schema `depends_on`, `on_exit`; ADR 0014 services section superseded; basics/services-depends-on (also its name and header comment "`depends_on` orders them") and integration-tests (drop depends_on, on_exit, change api readiness).
- id: MIN-4
  verdict: confirmed
  severity: minor
  notes: |
    reference.md §5.2: on_body_failure defaults `while: stop`, `until: continue`; its only use is deploy-health-check line 70 `on_body_failure: continue` on an `until`, i.e. the default. Both `while` uses are waits: deploy-health-check's body is only a debug `log`, while-draining's body is a display `kubectl get pods --no-headers`. `not_in` exists for the `result` subject (conditions.md operator table), so the `until` rewrite is valid; it runs the check at least once, which is harmless for these read-only commands. §5.6 already lets later `while` checks see the previous iteration's captures; F-0008 is about the body, as the finding says. Tying the decision to F-0008 is coherent.
  proposal_impact: |
    reference.md §5.2 table row and §5.6; RF-5 wording; conformance feature id `while`; ADR 0008 (body-failure note); basics/while-draining and deploy-health-check rewritten; deploy-health-check line 70 drops a no-op. If on_body_failure is cut but `until` keeps `continue`, nothing else changes.
- id: MIN-5
  verdict: partly
  severity: minor
  notes: |
    RF-18 and §5.7 quotes are accurate; VA-5 lists MATRIX_INDEX; used in basics/for-matrix and release-matrix, both a 3x2 OS/arch with a `when` exclusion. The nested-`each` order matches "first key varying slowest".
    Wrong: "the only source binding several variables" — `items` with `fields` also binds one variable per field (§5.7 `fields`).
    Unmentioned cost: in release-matrix the loop node is named `build ${OS}/${ARCH}`; with nesting, ARCH is bound only in the inner loop, so the outer name can't use it (rename needed). collect over a nested loop would give nested lists, but neither matrix example uses collect.
  proposal_impact: |
