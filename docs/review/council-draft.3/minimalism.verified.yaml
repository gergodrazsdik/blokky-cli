- id: MIN-6
  verdict: partly
  severity: minor
  notes: |
    RF-25 quote exact; the empty-source rule and ADR 0016 ("only `glob` needs `allow_empty`") match. `keep_blank` is a maintainer addition (ADR 0014) used by no example. `max_items: 500` appears once (changed-files-lint), no reason given.
    Wrong: "Both glob examples that could see zero matches set allow_empty". dotnet-build-test's `src/**/*.csproj` loop can see zero matches too and relies on the failing default (failing when there are no projects is the sensible behaviour there); release-matrix's `*` also uses the default. So the default is not only "the case plans opt out of".
    Incomplete: `max_items` is not just a resource bound. ADR 0003 Q8 replaced the brief's "mandatory `max_items`" for sources fed by captured output and notes "with an implicit `max_items`, a plan's bound isn't visible in its text"; the finding doesn't answer that reasoning. Making it apply to every source is coherent (glob also has unbounded size).
  proposal_impact: |
    reference.md §5.7 options and glob rules ("zero matches is an error unless allow_empty"); RF-25; schema; ADR 0016 empty-source rule and ADR 0003 Q8 superseded; basics/for-glob (its header text describes allow_empty) and dotnet-build-test (drop allow_empty; the src loop would then succeed silently on zero projects unless an assert is added); errors.md if a glob-empty code exists.
- id: MIN-7
  verdict: partly
  severity: minor
  notes: |
    §5.3 quote exact; ADR 0008 lists "integer factor and percentage jitter" as an option; syntax.md §6.4 decimals serve only `backoff.factor` and `jitter`. Uses: basics/retry-backoff and release-matrix.
    Overstated: release-matrix runs `gh release upload` with `concurrency: 4` and identical retry schedules against one endpoint, so a shared 5xx makes the four retries fire together; that is a (small) correlated-retry case jitter is meant for, so "Neither has a herd" is too strong. "forces conformance to specify RNG seeding": CF-41 already limits this ("cases with `jitter` assert bounds only, never the drawn values"; seed passed only when the adapter supports one), so the conformance cost is one rule. "only non-deterministic feature apart from completion order": EM-13 also lists timings, and race outcomes depend on completion order; minor.
  proposal_impact: |
    reference.md §5.2 row, §5.3; syntax.md §6.4 and field table (jitter row); schema; conformance README feature id `jitter` and CF-41; ADR 0008 superseded; basics/retry-backoff (header comment mentions jitter) and release-matrix line 112. Integer factor additionally removes the decimal grammar (§6.4) and changes `backoff.factor` validation.
