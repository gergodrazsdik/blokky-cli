- id: MIN-10
  verdict: confirmed
  severity: minor
  notes: |
    VA-56, VA-57, VA-59 say what the finding says; no `set` or `vars` value in examples/ uses `{ var: ... }` (all `{ var }` hits are exec/env/cwd); 9 plans use `set`; 52 plans total. reference.md §2.12 already says "There are no functions" and VA-57 "There are no functions", so the "keep no functions as an explicit non-goal" half is already done.
    Unweighed costs: `{ var: X }` is the reference form in every other executed field (env, argv, cwd), so forbidding it only in set/vars adds an exception users will hit by analogy; and `{ var: X, secret: true }` is one of the three secret sources in VA-49 (mark a captured non-secret value secret), which the proposal removes without a replacement. Low confidence is appropriate.
  proposal_impact: |
    variables.md VA-49 (secret sources), VA-56, VA-58 ("template or reference"); reference.md §2.12 values bullet; ADR 0015 values decision; schema set/vars value definition; no example changes.
