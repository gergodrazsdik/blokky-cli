- id: SQ-21
  lens: spec-quality
  kind: fix
  severity: minor
  where: multiple (list in evidence)
  claim: >-
    Mechanical inconsistencies, broken links and stale terms across the documents.
  evidence: |
    1. syntax.md §3.4 synonym table: "`params`, …, `vars`, `variables` (at the root) | `inputs`", but `vars` is a valid root key (§4.1, schema), so the suggestion can never fire for `vars`, and `variables` should probably suggest `vars`.
    2. variables.md VA-56 links `syntax.md#73-interpolation-in-display-strings`; the heading is "7.3 Interpolation in display strings and templates" (broken anchor; the only one found by a full link check).
    3. adr/0010 cites "EM-54" twice ("Short budgets (EM-54)", "Applied in: … EM-54"); EM-54 doesn't exist (moved to blokky-cli). EM gaps 34, 35, 37–42, 54 are covered by the "not reused" note; SH-31, CP-31 and CP-33 are gaps with no note.
    4. glossary "Plan" lists the plan-only keys as "`blokky:`, `inputs:`, `outputs:`, `defaults:`", missing `vars:` (syntax §4.1, overview §2.1 include it).
    5. glossary "Modifier" includes `capture`, which reference §3 defines as a leaf option, not a modifier.
    6. "Group" means do/all/any/race (glossary), but do/all/any/race/if (overview §2.1), and EM-66 says "a `do`, `all`, `if`, `for` iteration or other group". Which nodes are "groups" matters for reference §5.5 ("For a group node with `retry`").
    7. results.md §3 repetition "what ended them (`condition`, `max`, `timeout`, `failure`, `success`)" vs reference §5.1 "which bound ended the loop (`condition`, `max`, `timeout`)"; `ended_by` is asserted by conformance (CF table), so the value set must be one.
    8. results.md §3 "bindings | `exec`, `script`, `set`" omits `for` (`collect`, VA-55) and `tempdir.as`.
    9. EM-8 lists probes "in `if`, `while`, `until` and `retry` conditions", omitting `assert`, which conditions.md §6 evaluates in the node's own scope too.
    10. errors.md §5.3 BK_CONDITION_ERROR `detail.reason` has no value for invalid output encoding in `result: stdout` or probe stdout, and CO-38 doesn't say whether undecodable probe output is a condition error or becomes U+FFFD (reference §3 says U+FFFD "wherever output is shown as text"; captures fail).
    11. overview §2.3 subject list omits `command` (CO-45).
    12. CP-7: "Which engines are supported and how one is chosen is a later question (Q16b)" and SH-20 "the spec will state it" are open TODOs in normative text.
  proposal: |
    Fix each item; for 6, define "group" once (glossary) and use it consistently; for 7, choose one `ended_by` enumeration; for 10, add an `encoding` reason or state U+FFFD replacement for condition subjects.
  confidence: high

- id: SQ-22
  lens: spec-quality
  kind: clarify
