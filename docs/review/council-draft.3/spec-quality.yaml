  where: spec/results.md intro; spec/variables.md VA-51; spec/reference.md §4.3, §5.7; spec/shells.md §6
  claim: >-
    Some requirements and permissions are written in lower case, which syntax §1 says makes them non-normative.
  evidence: |
    syntax §1: keywords apply "when, and only when, they appear in all capitals."
    - results.md intro: "the run result … that every implementation must be able to produce" (the core conformance requirement; RS-1..RS-6 contain no MUST).
    - VA-51: "…MUST be replaced with `***` … Output must be masked even when a value is split across chunks." (the chunking requirement is lower case)
    - reference §4.3: "An implementation may also stop a whole run from outside" (permission; EM §7 has no MAY either).
    - shells.md §6: "implementations may flag the common mistakes"; "implementations may flag it for review" (SH-30 uses MAY for the same thing).
    - reference §5.7: "Item values and inputs used as `exec` arguments should be preceded by `--`" (advice to plan authors; fine if informative, but reads as SHOULD).
    The documents otherwise state most rules in the indicative ("is a plan error"), which is fine since each file declares itself normative; the issue is only the lower-case keywords mixed into rules that also use capitals.
  proposal: |
