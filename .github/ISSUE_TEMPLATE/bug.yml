---
name: Bug report
description: Something in blokky-cli or its docs is wrong.
labels: ["bug", "cli"]
body:
  - type: markdown
    attributes:
      value: |
        Blokky is in its **specification phase**: there is no release yet, so
        bugs today are mostly about the docs, the design or the repo tooling.
        Security problems go through private reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where?
      description: File, section, command or version (if any).
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, and tool versions if relevant.
