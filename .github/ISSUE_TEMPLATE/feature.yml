---
name: Feature request
description: Suggest an improvement to the CLI, its docs or distribution.
labels: ["enhancement", "cli"]
body:
  - type: markdown
    attributes:
      value: |
        Language features (new node kinds, modifiers, conditions) belong in
        blokky-specs. Check ROADMAP.md first: many features are already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you (or your agent) trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? Alternatives you considered?
  - type: textarea
    id: shell
    attributes:
      label: Equivalent shell today
      description: If relevant, the shell you write today without Blokky.
      render: shell
